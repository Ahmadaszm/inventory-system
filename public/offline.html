<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>لا يوجد اتصال — مخزون زمزم</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: #fff; border-radius: 16px; padding: 28px; max-width: 360px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    h1 { font-size: 1.25rem; margin: 0 0 8px; color: #9B1B1E; }
    p { color: #64748b; font-size: 0.95rem; line-height: 1.6; margin: 0 0 20px; }
    button { background: #9B1B1E; color: #fff; border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 700; font-size: 1rem; width: 100%; }
  </style>
</head>
<body>
  <div class="card">
    <h1>تعذر الاتصال بالخادم</h1>
    <p>
      الشبكة ضعيفة أو غير متاحة (بيانات الجوال / 3G).<br />
      تأكد من تفعيل الإنترنت ثم أعد المحاولة.
    </p>
    <button type="button" onclick="location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
